    // ---- Two-phase analysis ----

    async function analyzeCIJobs() {
      if (ciWatcherLoading || ciWatcherAnalyzing) return;

      // Phase 1: fetch metadata
      ciWatcherLoading = true;
      ciWatcherMeta = null;
      ciWatcherAnalysis = {};
      ciWatcherExpandedRuns.clear();
      ciWatcherExpandedSpecs.clear();
      ciWatcherAnalyzedCount = 0;
      renderCIWatcherView();

      try {
        const resp = await fetch(`/api/ci-watcher/${encodeURIComponent(ciWatcherBranch)}?limit=${ciWatcherLimit}&repo=${encodeURIComponent(ciWatcherRepo)}&job=${encodeURIComponent(ciWatcherJob)}`);
        if (!resp.ok) { const e = await resp.json().catch(() => ({})); throw new Error(e.details || e.error || 'Failed'); }
        ciWatcherMeta = await resp.json();
      } catch (err) {
        console.error('CI Watcher Phase 1 error:', err);
        showAlert(`CI Watcher: ${err.message}`, 'error');
        ciWatcherLoading = false;
        renderCIWatcherView();
        return;
      }

      ciWatcherLoading = false;
      renderCIWatcherView(); // Show instant results

      // Phase 2: analyze logs progressively
      const failedRuns = ciWatcherMeta.failedRuns || [];
      if (failedRuns.length === 0) return;

      ciWatcherAnalyzing = true;
      ciWatcherAnalyzeTotal = failedRuns.length;
      updateCIWatcherProgress();

      const BATCH_SIZE = 5;
      for (let i = 0; i < failedRuns.length; i += BATCH_SIZE) {
        const batch = failedRuns.slice(i, i + BATCH_SIZE).map(r => ({
          buildId: r.buildId, buildLogUrl: r.buildLogUrl, durationSecs: r.durationSecs
        }));

        try {
          const resp = await fetch('/api/ci-watcher/analyze-logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ runs: batch, jobSuffix: ciWatcherJob, repo: ciWatcherRepo })
          });
          if (resp.ok) {
            const data = await resp.json();
            for (const result of data.results) {
              ciWatcherAnalysis[result.buildId] = result;
              ciWatcherAnalyzedCount++;
            }
          }
        } catch (err) {
          console.error('CI Watcher Phase 2 batch error:', err);
        }

        updateCIWatcherProgress();
        refreshCIWatcherDashboard();
      }

      ciWatcherAnalyzing = false;
      refreshCIWatcherDashboard();
      updateCIWatcherProgress();
    }

    function updateCIWatcherProgress() {
      const btn = document.querySelector('#appContent button[onclick="analyzeCIJobs()"]');
      if (!btn) return;
      if (ciWatcherAnalyzing) {
        btn.disabled = true;
        btn.innerHTML = `<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:white;"></div> Analyzing ${ciWatcherAnalyzedCount}/${ciWatcherAnalyzeTotal}`;

        btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg> Analyze`;

    // ---- Dashboard rendering ----

    function renderCIWatcherDashboard() {
      if (!ciWatcherMeta) return '';
      const meta = ciWatcherMeta;
      const rs = meta.resultSummary;

      if (meta.totalRuns === 0) {
        return `<div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6 text-center"><p class="text-yellow-800">No job history data found for <strong>${meta.branch}</strong>.</p></div>`;
      }

      if (rs.failure === 0) {
        return `<div class="bg-green-50 border border-green-200 rounded-lg p-6 text-center">
          <svg class="w-12 h-12 mx-auto mb-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <p class="text-green-800 font-medium">All ${meta.totalRuns} recent runs passed!</p></div>`;
      }

      const agg = computeAggregates();
      const analyzedRuns = getAnalyzedRuns();

      return `
        ${renderSummaryCards(meta)}
        ${ciWatcherAnalyzing ? renderProgressBar() : ''}
        ${ciWatcherAnalyzedCount > 0 ? renderCategoryAndStageBreakdown(agg) : ''}
        ${agg.topSpecs.length > 0 ? renderTopSpecsWithFlakeScore(agg) : ''}
        ${agg.prImpact.length > 0 ? renderPRImpact(agg) : ''}
        ${renderRunTimeline(analyzedRuns)}

    function renderSummaryCards(meta) {
      const rs = meta.resultSummary;
      const passRateNum = parseInt(meta.passRate);
      const prColor = passRateNum >= 70 ? 'text-green-600' : passRateNum >= 40 ? 'text-yellow-600' : 'text-red-600';

            <div class="text-sm text-gray-500">Failed</div>
            <div class="text-2xl font-bold text-red-600">${rs.failure}</div>
          </div>

            <div class="text-2xl font-bold ${prColor}">${meta.passRate}</div>
          </div>

            <div class="text-sm text-gray-500">Aborted</div>
            <div class="text-2xl font-bold text-gray-600">${rs.aborted}</div>
          </div>
          <div class="bg-white rounded-lg shadow p-4 border-l-4 border-l-purple-500">
            <div class="text-sm text-gray-500">Analyzed</div>
            <div class="text-2xl font-bold text-gray-900">${ciWatcherAnalyzedCount}<span class="text-sm font-normal text-gray-500">/${ciWatcherAnalyzeTotal}</span></div>
          </div>
        </div>`;
    }

    function renderCategoryAndStageBreakdown(agg) {
      const allCatKeys = Object.keys(CATEGORY_STYLES);
      const catEntries = allCatKeys.filter(k => agg.categorySummary[k] > 0).map(k => ({
        ...CATEGORY_STYLES[k], key: k, count: agg.categorySummary[k]
      }));
      const catTotal = catEntries.reduce((s, c) => s + c.count, 0);

      return `
        <div class="mb-6">
          <div class="bg-white rounded-lg shadow p-4">
            <h3 class="text-sm font-semibold text-gray-700 mb-3">Failure Categories</h3>
            <div class="flex flex-wrap gap-3 mb-3">
              ${catEntries.map(c => `<div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full ${c.bar}"></span><span class="text-xs text-gray-700">${c.label}</span><span class="px-1.5 py-0.5 ${c.bg} ${c.text} text-xs font-medium rounded-full">${c.count}</span></div>`).join('')}
            </div>
            <div class="flex h-3 rounded-full overflow-hidden bg-gray-200">
              ${catEntries.map(c => `<div class="${c.bar}" style="width:${(c.count / catTotal * 100).toFixed(1)}%" title="${c.label}: ${c.count}"></div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function renderTopSpecsWithFlakeScore(agg) {
      const specs = agg.topSpecs;
      return `
        <div class="bg-white rounded-lg shadow mb-6 overflow-hidden">
          <div class="p-4 border-b bg-gray-50">
            <h3 class="text-sm font-semibold text-gray-700">Top Failing Specs</h3>
            <p class="text-xs text-gray-500 mt-1">Specs failing across many different PRs are confirmed flakes. Click a row to see affected PRs and build logs.</p>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead><tr class="border-b bg-gray-50">
                <th class="text-left px-4 py-2 text-gray-600 font-medium">#</th>
                <th class="text-left px-4 py-2 text-gray-600 font-medium">Spec</th>
                <th class="text-center px-4 py-2 text-gray-600 font-medium">Flake Score</th>
                <th class="text-right px-4 py-2 text-gray-600 font-medium">Runs</th>
                <th class="text-right px-4 py-2 text-gray-600 font-medium">Failures</th>
              </tr></thead>
              <tbody>
                ${specs.map((spec, idx) => {
                  const isFlake = spec.distinctPRs >= 3;
                  const isMaybe = spec.distinctPRs === 2;
                  const isExpanded = ciWatcherExpandedSpecs.has(spec.spec);
                  const flakeBadge = isFlake
                    ? '<span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full">Flake</span>'
                    : isMaybe
                    ? '<span class="px-2 py-0.5 bg-yellow-100 text-yellow-700 text-xs font-medium rounded-full">Likely</span>'
                    : '<span class="px-2 py-0.5 bg-green-100 text-green-700 text-xs font-medium rounded-full">1 PR</span>';
                  const chevron = `<svg class="w-4 h-4 text-gray-400 transition-transform ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>`;

                  const prsByNumber = {};
                  for (const run of (spec.runs || [])) {
                    const key = run.prNumber || 'unknown';
                    if (!prsByNumber[key]) prsByNumber[key] = { prNumber: run.prNumber, prTitle: run.prTitle, prLink: run.prLink, author: run.author, runs: [] };
                    prsByNumber[key].runs.push(run);
                  }
                  const prGroups = Object.values(prsByNumber).sort((a, b) => b.runs.length - a.runs.length);

                  const detailsRow = isExpanded ? `
                  <tr data-spec-detail="${idx}">
                    <td colspan="5" class="px-0 py-0">
                      <div class="bg-gray-50 border-t border-gray-200 px-4 py-3">
                        ${prGroups.map(prGroup => `
                          <div class="mb-3 last:mb-0">
                            <div class="flex items-center gap-2 mb-1.5">
                              <a href="${prGroup.prLink}" target="_blank" class="text-blue-600 hover:underline text-sm font-medium">#${prGroup.prNumber}</a>
                              <span class="text-gray-700 text-xs truncate max-w-md" title="${escapeHtml(prGroup.prTitle)}">${escapeHtml((prGroup.prTitle || '').substring(0, 80))}</span>
                              <span class="text-gray-400 text-xs">by ${escapeHtml(prGroup.author)}</span>
                              <span class="ml-auto px-1.5 py-0.5 bg-red-100 text-red-700 text-xs font-medium rounded-full">${prGroup.runs.length}x</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 ml-4">
                              ${prGroup.runs.map(run => `
                                <a href="${run.buildLogUrl}" target="_blank"
                                   class="inline-flex items-center gap-1 px-2 py-1 bg-white border border-gray-200 rounded text-xs text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors"
                                   title="Build ${run.buildId} - ${run.started}">
                                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                  ${run.duration}
                                  <span class="text-gray-400">${run.failCount > 0 ? '(' + run.failCount + ' failed)' : ''}</span>
                                </a>
                              `).join('')}
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    </td>
                  </tr>` : '';

                  return `
                  <tr class="border-b hover:bg-gray-50 cursor-pointer ${isFlake ? 'bg-red-50/30' : ''}" onclick="toggleSpecRow('${escapeHtml(spec.spec).replace(/'/g, "\\'")}')">
                    <td class="px-4 py-2.5 text-gray-400">${chevron}</td>
                    <td class="px-4 py-2.5 font-mono text-red-800 text-xs whitespace-nowrap" title="${escapeHtml(spec.spec)}">${escapeHtml(spec.spec)}</td>
                    <td class="px-4 py-2.5 text-center">${flakeBadge}<span class="ml-1 text-xs text-gray-500">${spec.distinctPRs} PRs</span></td>
                    <td class="px-4 py-2.5 text-right"><span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-medium rounded-full">${spec.runCount}</span></td>
                    <td class="px-4 py-2.5 text-right text-gray-700">${spec.totalFailures}</td>
                  </tr>${detailsRow}`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function toggleSpecRow(specName) {
      if (ciWatcherExpandedSpecs.has(specName)) {
        ciWatcherExpandedSpecs.delete(specName);
      } else {
        ciWatcherExpandedSpecs.add(specName);
      }
      refreshCIWatcherDashboard();
    }

    function renderPRImpact(agg) {
      const prs = agg.prImpact.slice(0, 15);
      return `
        <div class="bg-white rounded-lg shadow mb-6 overflow-hidden">
          <div class="p-4 border-b bg-gray-50">
            <h3 class="text-sm font-semibold text-gray-700">PR Impact</h3>
            <p class="text-xs text-gray-500 mt-1">PRs with the most failed CI runs.</p>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="border-b bg-gray-50">
                <th class="text-left px-4 py-2 text-gray-600 font-medium">PR</th>
                <th class="text-left px-4 py-2 text-gray-600 font-medium">Title</th>
                <th class="text-left px-4 py-2 text-gray-600 font-medium">Author</th>
                <th class="text-right px-4 py-2 text-gray-600 font-medium">Failures</th>
                <th class="text-left px-4 py-2 text-gray-600 font-medium">Categories</th>
              </tr></thead>
              <tbody>
                ${prs.map(p => `
                  <tr class="border-b last:border-b-0 hover:bg-gray-50">
                    <td class="px-4 py-2.5"><a href="${p.prLink}" target="_blank" class="text-blue-600 hover:underline font-medium">#${p.pr}</a></td>
                    <td class="px-4 py-2.5 text-gray-700 text-xs truncate max-w-xs" title="${escapeHtml(p.title)}">${escapeHtml((p.title || '').substring(0, 60))}</td>
                    <td class="px-4 py-2.5 text-gray-500 text-xs">${escapeHtml(p.author)}</td>
                    <td class="px-4 py-2.5 text-right"><span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full">${p.count}x</span></td>
                    <td class="px-4 py-2.5">${Object.entries(p.categories).map(([c, n]) => getCategoryBadge(c)).join(' ')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function renderRunTimeline(runs) {
      if (runs.length === 0) return '';
      return `
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <div class="p-4 border-b bg-gray-50">
            <h3 class="text-sm font-semibold text-gray-700">Failed Runs (${runs.length})</h3>
          </div>
          <div class="divide-y" id="ciWatcherRunList">
            ${runs.map((run, idx) => renderRunCard(run, idx)).join('')}
          </div>
        </div>`;
    }

    function renderRunCard(run, idx) {
      const isExpanded = ciWatcherExpandedRuns.has(run.buildId);
      const timeAgo = getRelativeTime(new Date(run.started));
      const analysis = ciWatcherAnalysis[run.buildId];

      return `
        <div class="p-4" data-ci-run="${run.buildId}">
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 min-w-0 flex-1">
              ${run.prNumber ? `<a href="${run.prLink}" target="_blank" class="text-blue-600 hover:underline font-medium text-sm whitespace-nowrap">PR #${run.prNumber}</a>` : '<span class="text-gray-400 text-sm">No PR</span>'}
              <span class="text-gray-400 text-xs">|</span>
              <span class="text-gray-500 text-xs truncate" title="${escapeHtml(run.prTitle)}">${escapeHtml(run.prTitle)}</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-gray-400 text-xs" title="${new Date(run.started).toLocaleString()}">${timeAgo}</span>
              <span class="text-gray-400 text-xs">${run.duration}</span>
              ${analysis ? getCategoryBadge(analysis.category) : '<span class="px-2 py-0.5 bg-gray-50 text-gray-400 text-xs rounded-full">pending</span>'}
              <a href="${run.prowUrl}" target="_blank" class="text-gray-400 hover:text-blue-600 transition-colors" title="View in Prow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </a>
              <button onclick="toggleCIWatcherRun('${run.buildId}')" class="text-sm text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-2 py-1 rounded transition-colors">
                ${isExpanded ? 'Hide' : 'Details'}
              </button>
            </div>
          </div>
          ${isExpanded ? renderRunDetails(run, analysis) : ''}
        </div>`;
    }

    function renderRunDetails(run, analysis) {
      if (!analysis) {
        return `<div class="mt-3 bg-gray-50 rounded-lg p-3"><p class="text-sm text-gray-500">Analysis pending...</p></div>`;
      }
      if (!analysis.failingSpecs || analysis.failingSpecs.length === 0) {
        return `
          <div class="mt-3 bg-gray-50 rounded-lg p-3">
            <p class="text-sm text-gray-500">No Cypress spec failures parsed. Category: <strong>${analysis.category}</strong>, Stage: <strong>${analysis.stage}</strong></p>
            <a href="${run.buildLogUrl}" target="_blank" class="text-xs text-blue-600 hover:underline mt-1 inline-block">View raw build log</a>
          </div>`;
      }
      return `
        <div class="mt-3 bg-red-50 border border-red-200 rounded-lg p-3">
          <div class="flex items-center justify-between mb-2">
            <h4 class="text-sm font-medium text-red-900">Failing Specs (${analysis.failingSpecs.length})</h4>
            <a href="${run.buildLogUrl}" target="_blank" class="text-xs text-blue-600 hover:underline">Build log</a>
          </div>
          <ul class="space-y-1">
            ${analysis.failingSpecs.map(spec => `
              <li class="flex items-center justify-between bg-white rounded px-3 py-1.5 border border-red-100 text-sm">
                <span class="font-mono text-red-800 text-xs break-all" title="${escapeHtml(spec.spec)}">${escapeHtml(spec.spec)}</span>
                <span class="ml-2 bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-medium flex-shrink-0">${spec.count > 0 ? spec.count + ' failed' : 'failed'}</span>
              </li>`).join('')}
          </ul>
        </div>`;
    }

    function toggleCIWatcherRun(buildId) {
      if (ciWatcherExpandedRuns.has(buildId)) {
        ciWatcherExpandedRuns.delete(buildId);
      } else {
        ciWatcherExpandedRuns.add(buildId);
      }
      const card = document.querySelector(`[data-ci-run="${buildId}"]`);
      if (card) {
        const runs = getAnalyzedRuns();
        const run = runs.find(r => r.buildId === buildId);
        if (run) card.outerHTML = renderRunCard(run, runs.indexOf(run));
      }
    }

    function getRelativeTime(date) {
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins < 1) return 'just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d ago`;
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
